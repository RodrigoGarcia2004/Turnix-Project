server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: turnix-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      default-filters:
        - AddResponseHeader=X-Powered-By, Turnix-Gateway
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
      routes:
        # ===== API REST del backend =====
        - id: turnix-api
          uri: ${BACKEND_URL:http://localhost:8001}
          predicates:
            - Path=/api/**

        # ===== WebSockets (chat / notificaciones) =====
        - id: turnix-ws
          uri: ${BACKEND_URL_WS:ws://localhost:8001}
          predicates:
            - Path=/ws/**

        # ===== Frontend estatico (paginas HTML, CSS, JS, imagenes) =====
        # OJO: /worker/** se EXCLUYE deliberadamente de aqui para que lo
        # gestione WorkerStatsController localmente.
        - id: turnix-frontend
          uri: ${BACKEND_URL:http://localhost:8001}
          predicates:
            - Path=/, /index.html, /acceso.html, /admin.html, /paciente.html, /medico.html, /aviso-legal.html, /turnix-theme.css, /turnix-theme.js, /turnix-logo.png, /favicon.ico, /static/**, /uploads/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Turnix Gateway
    description: Puerta de entrada del sistema Turnix Salud
    version: 1.0.0

# ===== Configuracion del worker programado =====
worker:
  healthcheck:
    interval-ms: 15000
    initial-delay-ms: 5000

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.turnix.gateway: INFO
