<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnix - Redirigiendo al acceso...</title>
    <meta http-equiv="refresh" content="0; url=acceso.html">
    <link rel="canonical" href="acceso.html">
    <style>
        :root{
            --primary-bg: #F0F8FF;
            --secondary-bg: #E0F2F1;
            --dark-blue: #2C3E50;
            --medico-blue: #1E88E5;
        }
        html, body {
            margin: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            color: var(--dark-blue);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrap {
            text-align: center;
            animation: fadeIn .6s ease-out;
        }
        @keyframes fadeIn { from{opacity:0; transform: translateY(8px);} to{opacity:1; transform:none;} }
        .wrap img { width:78px; height:78px; object-fit:contain; filter: drop-shadow(0 6px 18px rgba(13,148,136,0.25)); }
        .wrap h1 { margin: 18px 0 6px; font-size: 1.8em; font-weight:700; }
        .wrap p { margin: 0; color: #5b6b7a; }
        .spinner {
            margin: 22px auto 0;
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 3px solid rgba(30,136,229,.18);
            border-top-color: var(--medico-blue);
            animation: spin .9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: var(--medico-blue); text-decoration: none; font-weight: 600; }
        .fallback { margin-top: 18px; font-size: 13px; color: #64748b; }
    </style>
</head>
<body>
    <div class="wrap" data-testid="redirect-to-acceso">
        <img src="turnix-logo.png" alt="Turnix">
        <h1>Turnix · Salud</h1>
        <p>Te llevamos al portal de acceso…</p>
        <div class="spinner" aria-label="Cargando"></div>
        <p class="fallback">
            ¿No te redirige automáticamente?
            <a href="acceso.html" data-testid="link-acceso-manual">Pulsa aquí para entrar</a>.
        </p>
    </div>
    <script>
        // Redirección instantánea preservando query/hash si los hubiera.
        // Usamos location.replace para no dejar la página en el historial.
        (function(){
            try {
                var qs = window.location.search || '';
                var hash = window.location.hash || '';
                window.location.replace('acceso.html' + qs + hash);
            } catch (e) {
                window.location.href = 'acceso.html';
            }
        })();
    </script>
</body>
</html>
